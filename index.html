<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varun Kumar A | Creative Designer</title>
    <!-- Google Fonts for ultra-bold geometric cut typography (Hero) & Montserrat for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;900&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FDF5E6; 
            --dark-green: #0b3b24; 
            --light-green: #1a5939;
            --accent: #E6C287; 
            --border: #0b3b24;
            --hero-navy: #16213E;
            --hero-cyan: #00E5FF;
            --transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Applied standard sans-serif to the entire body */
        body {
            background-color: var(--bg-cream);
            background-image: radial-gradient(var(--accent) 2.5px, transparent 2.5px);
            background-size: 32px 32px;
            color: var(--dark-green);
            line-height: 1.6;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            position: relative;
        }

        /* Ambient Dynamic Background Shapes */
        .bg-shapes { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .shape { position: absolute; background: var(--accent); opacity: 0.35; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation: morphAndFloat infinite alternate ease-in-out; filter: blur(28px); }
        .shape1 { width: 55vw; height: 55vw; top: -15%; left: -15%; background: var(--accent); animation-duration: 16s; }
        .shape2 { width: 60vw; height: 50vw; bottom: -20%; right: -15%; background: var(--light-green); opacity: 0.18; animation-duration: 24s; animation-direction: alternate-reverse; }
        .shape3 { width: 40vw; height: 40vw; top: 35%; left: 55%; background: var(--accent); opacity: 0.28; animation-duration: 20s; animation-delay: -6s; }

        @keyframes morphAndFloat {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: scale(0.85) rotate(0deg) translate(0, 0); }
            50% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: scale(1.35) rotate(180deg) translate(5vw, 5vh); }
            100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: scale(0.95) rotate(360deg) translate(-5vw, -2vh); }
        }

        /* Animations */
        .fade-in { opacity: 0; transform: translateY(30px); transition: var(--transition); }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* Hanging Mouse Menu */
        @keyframes swing { 0% { transform: rotate(11deg); } 100% { transform: rotate(-11deg); } }
        #mouse-menu-container {
            position: fixed; top: -4px; right: 4vw; z-index: 1000; cursor: pointer; transform-origin: top center;
            animation: swing 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
        }
        .hanging-mouse-svg { width: clamp(52px, 6.5vw, 85px); height: auto; filter: drop-shadow(0px 12px 18px rgba(11, 59, 36, 0.45)); transition: var(--transition); }
        #mouse-menu-container:hover .hanging-mouse-svg { filter: drop-shadow(0px 16px 28px rgba(11, 59, 36, 0.7)) brightness(1.15); }

        /* Dropdown Navigation Menu */
        .nav-menu {
            position: fixed; top: 105px; right: 4vw; background: rgba(253, 245, 230, 0.96); border: 2px solid var(--dark-green);
            border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; opacity: 0; visibility: hidden;
            transform: translateY(-20px); transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 999; box-shadow: 0px 14px 35px rgba(0,0,0,0.14); backdrop-filter: blur(8px);
        }
        .nav-menu.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .nav-menu a {
            color: var(--dark-green); text-decoration: none; padding: 10px 26px; font-weight: 700; font-size: 1.15rem;
            transition: all 0.3s; border-radius: 8px; text-align: right; text-transform: uppercase; letter-spacing: 1.5px;
        }
        .nav-menu a:hover { background: var(--accent); color: var(--dark-green); transform: translateX(-6px); }

        /* Paper Plane Animation Object */
        #paper-plane {
            position: fixed;
            top: -50px; left: -50px;
            width: clamp(35px, 4vw, 55px);
            height: auto;
            z-index: 9999;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(4px 8px 12px rgba(11, 59, 36, 0.35));
        }

        /* HERO SECTION */
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; padding: 40px 15px; overflow: visible; }
        .hero-composition { position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; width: 100%; max-width: 900px; margin: 0 auto; }
        .hero-poster-canvas {
            position: relative; width: clamp(320px, 94vw, 820px); padding-left: clamp(48px, 9vw, 85px); padding-right: clamp(48px, 9vw, 85px);
            display: flex; flex-direction: column; align-items: flex-start;
        }

        /* Hero Font Keeps Custom Display Typeface */
        .typo-graphics {
            font-family: 'Anton', 'Syne', sans-serif; font-size: clamp(3.8rem, 15vw, 9.5rem); font-weight: 900; color: var(--dark-green);
            letter-spacing: clamp(1px, 0.5vw, 4px); line-height: 0.85; text-transform: uppercase; 
            margin-bottom: clamp(15px, 3.5vw, 40px);
            text-shadow: 2px 2px 0px rgba(253, 245, 230, 0.7);
        }

        .typo-block { 
            position: relative; display: flex; flex-direction: column; width: 100%; 
            gap: clamp(15px, 2.5vw, 35px); 
        }

        .typo-de, .typo-ner {
            font-family: 'Anton', 'Syne', sans-serif; font-size: clamp(9.5rem, 36vw, 24rem); font-weight: 900; 
            line-height: 0.9;
            color: var(--dark-green); letter-spacing: clamp(-4px, -1.5vw, -12px); text-transform: uppercase; 
            position: relative; user-select: none; filter: drop-shadow(0px 8px 18px rgba(11, 59, 36, 0.12));
        }

        .typo-sig {
            font-family: 'Anton', 'Syne', sans-serif; font-size: clamp(9.5rem, 36vw, 24rem); font-weight: 900; 
            line-height: 0.9;
            color: #00BFFF; letter-spacing: clamp(-4px, -1.5vw, -12px); text-transform: uppercase; position: relative; user-select: none;
            text-shadow: 0 0 15px rgba(0, 191, 255, 0.6), 0 0 35px rgba(0, 191, 255, 0.4), 3px 3px 0px rgba(11, 59, 36, 0.2);
        }

        .typo-signature {
            font-family: 'Montserrat', sans-serif; font-size: clamp(1.6rem, 5.2vw, 3.4rem); font-weight: 700; color: var(--dark-green); letter-spacing: 0.5px;
            margin-top: clamp(20px, 4vw, 45px); align-self: flex-end; margin-right: clamp(10px, 4vw, 40px); text-shadow: 1px 1px 0px var(--bg-cream);
        }

        /* 3D Illustrator Toolbar */
        .hero-toolbar {
            position: absolute; left: 0; top: 52%; transform: translateY(-50%); width: clamp(38px, 6.5vw, 66px); background: linear-gradient(180deg, #383838 0%, #202020 100%);
            border-radius: 9px; padding: clamp(6px, 1.2vw, 12px) clamp(4px, 0.8vw, 8px); display: flex; flex-direction: column; gap: clamp(5px, 1vw, 9px);
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.25), inset -2px -2px 3px rgba(0,0,0,0.8), 8px 18px 30px rgba(0,0,0,0.45); border: 1px solid #1a1a1a; z-index: 6;
        }
        .hero-toolbar .tool { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 3px; box-sizing: border-box; border-radius: 4px; transition: background 0.2s; }
        .hero-toolbar .tool:hover { background: rgba(255,255,255,0.12); }
        .hero-toolbar .tool svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }

        /* Floating 3D Neo-Glow Icons */
        .app-icon {
            position: absolute; width: clamp(54px, 11vw, 100px); aspect-ratio: 1; border-radius: 24%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-family: 'Montserrat', sans-serif; font-size: clamp(1.4rem, 3.8vw, 3.2rem); z-index: 4; transform: translateZ(0);
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.45), inset -3px -3px 8px rgba(0,0,0,0.7), 10px 18px 32px rgba(0,0,0,0.45); animation: floatIcon 5s ease-in-out infinite alternate;
        }
        @keyframes floatIcon { 0% { transform: translateY(0px) rotate(var(--rot)); } 100% { transform: translateY(-16px) rotate(calc(var(--rot) + 4deg)); } }

        .icon-ps { top: 7%; right: clamp(-6px, 1vw, 20px); background: linear-gradient(145deg, #022340, #001121); color: #31A8FF; border: 2px solid #003666; --rot: 7deg; text-shadow: 0 0 10px #31A8FF, 0 0 25px rgba(49, 168, 255, 0.8); }
        .icon-ai { top: 32%; right: clamp(-18px, -0.5vw, 6px); background: linear-gradient(145deg, #3d0d00, #1f0500); color: #FF9A00; border: 2px solid #661a00; --rot: -6deg; animation-delay: -1.8s; text-shadow: 0 0 10px #FF9A00, 0 0 25px rgba(255, 154, 0, 0.85); }
        .icon-ae { top: 57%; right: clamp(-10px, 0.8vw, 15px); background: linear-gradient(145deg, #0c005e, #040026); color: #D699FF; border: 2px solid #200099; --rot: 10deg; animation-delay: -3.4s; text-shadow: 0 0 10px #D699FF, 0 0 25px rgba(214, 153, 255, 0.85); }
        .icon-blender { 
            top: 81%; right: clamp(-14px, 0.2vw, 10px); background: linear-gradient(145deg, #ea7600, #b55a00); color: #ffffff;
            border: 2px solid #ff9d42; --rot: -8deg; animation-delay: -1.2s; text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.6);
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.5), inset -3px -3px 8px rgba(0,0,0,0.6), 10px 18px 32px rgba(0,0,0,0.45);
        }

        /* SVG Overlays - Stylus Pen & Wired Mouse */
        .svg-mouse-layer { position: absolute; top: 30%; left: clamp(20px, 5vw, 40px); width: 95%; height: 48%; z-index: 10; pointer-events: none; filter: drop-shadow(12px 22px 22px rgba(
